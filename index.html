<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="uniform.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Hello World</title>
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <h1>TOP Library</h1>
      <div class="new-container">
        <h2>Books</h2>
        <button command="show-modal" commandfor="new-book">New book</button>
      </div>
      <ul class="books"></ul>
      <dialog id="new-book">
        <div class="dialog-header">
          <button class="new-book-close" aria-label="close">
            <svg>
              <use href="assets/icons/close-circle.svg#close-circle"></use>
            </svg>
          </button>
        </div>
        <h4 class="dialog-title">New book</h4>
        <form method="dialog">
          <div class="dialog-input-container">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" required />
          </div>
          <div class="dialog-input-container">
            <label for="author">Author:</label>
            <input type="text" name="author" id="author" required />
          </div>
          <div class="dialog-input-container">
            <label for="year">Year:</label>
            <input type="number" name="year" id="year" max="2026" required />
          </div>
          <div class="dialog-footer">
            <button>Add to library</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
